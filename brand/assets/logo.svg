<?xml version="1.0" encoding="utf-8"?>
<!--
  FINKNOW Wortmarken-Logo (Glühbirne als „O").

  Farb-Konvention:
    - currentColor (Buchstaben)  → erbt vom Container, theme-tauglich.
      In Dark-Mode hell, in Light-Mode dunkel.
    - var(--brand-logo-accent, #99FF33)  → Akzent-Symbol (Glühbirne).
      Standard: FINKNOW-Grün. Überschreibbar per CSS-Variable, falls
      Brand- oder Theme-Anpassung gewünscht.

  Hinweis: bewusst KEIN Hintergrund-Rechteck — Logo bleibt transparent
  und legt sich sauber über beliebige Hintergründe/Themes.

  Hinweis Kerning: Wortmarke mechanisch aufgebaut (zusätzliches N zwischen
  I und K eingefügt, Folge-Glyphen um +254 verschoben). Kerning ist
  gleichmässig, aber nicht handoptimiert — Design-Review empfohlen.
-->
<svg width="353" height="87" viewBox="109 167 1871 461" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Buchstaben: "FINKN W" (Glühbirne als „O") — folgt der Container-color -->
  <g fill="currentColor">
    <!-- F  (x 129..271, Balken 142 breit) -->
    <path d="M129 331 h142 v44 h-96 v40 h84 v44 h-84 v81 h-46 z"/>

    <!-- I  (x 367..413) -->
    <path d="M367 331 h46 v209 h-46 z"/>

    <!-- N  (neu eingefügt, x 498..696) -->
    <path d="M498 331 h52 l100 130 v-130 h46 v209 h-52 l-100 -130 v130 h-46 z"/>

    <!-- K  (x 781..985, +254) -->
    <path d="M781 331 h46 v79 l84 -79 h66 l-100 95 l108 114 h-62 l-82 -88 -14 13 v75 h-46 z"/>

    <!-- N  (x 1050..1248, +254) -->
    <path d="M1050 331 h52 l100 130 v-130 h46 v209 h-52 l-100 -130 v130 h-46 z"/>

    <!-- W  (x 1665..1960, +254) -->
    <path d="M1665 331 h48 l34 138 l40 -138 h44 l40 138 l34 -138 h48 l-58 209 h-46 l-40 -135 l-40 135 h-46 z"/>
  </g>

  <!-- Glühbirne als "O": FINKNOW-Grün, bleibt konstant über Themes (+254).
       var(--brand-logo-accent) erlaubt spätere Anpassung per CSS. -->
  <g fill="none" stroke="var(--brand-logo-accent, #99FF33)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Kolben + birnenförmige Schultern + geschlossener Hals-Boden als EIN durchgehender Pfad -->
    <path d="M1444 535
             C 1444 514, 1438.4 486.8, 1416 470
             A 100 100 0 1 1 1536 470
             C 1513.6 486.8, 1508 514, 1508 535"/>
    <!-- Hals-Boden: verbindet die beiden Hals-Enden bündig -->
    <line x1="1444" y1="535" x2="1508" y2="535"/>
    <!-- 1 Gewinde-Ring -->
    <line x1="1440" y1="565" x2="1512" y2="565"/>
    <!-- Sockel-Spitze (schmaler Boden) -->
    <line x1="1458" y1="595" x2="1494" y2="595"/>
    <!-- Strahlen: oben senkrecht, seitlich steil -->
    <line x1="1476" y1="200" x2="1476" y2="240"/>
    <line x1="1366" y1="244" x2="1388" y2="279"/>
    <line x1="1586" y1="244" x2="1564" y2="279"/>
  </g>
</svg>
